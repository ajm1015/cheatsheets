<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS Field Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #b8ae9c;
    --bg-warm: #c5bdb0;
    --panel: #d8d2c6;
    --panel-light: #e6e1d7;
    --panel-dark: #a89e8e;
    --highlight: #f0ece4;
    --shadow: #8a8070;
    --shadow-deep: #6e655a;
    --purple: #5c4a8a;
    --purple-bright: #7b61ff;
    --purple-light: #9b88cc;
    --purple-dim: #3e3260;
    --gold: #d4952a;
    --gold-light: #f0c060;
    --red: #c04040;
    --cyan: #2a8a8a;
    --text: #1e1b18;
    --text-dim: #6b6358;
    --text-light: #f0ece4;
    --mono: 'IBM Plex Mono', 'Courier New', 'Menlo', 'Consolas', monospace;
    --sans: 'IBM Plex Sans', 'Lucida Grande', 'Geneva', 'Helvetica', sans-serif;
    --bevel-out: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--highlight), inset -2px -2px 0 var(--shadow-deep), inset 2px 2px 0 #f8f5f0;
    --bevel-in: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--highlight), inset 2px 2px 0 var(--shadow-deep), inset -2px -2px 0 #f8f5f0;
    --bevel-out-sm: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--highlight);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%),
      linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%);
    background-size: 4px 4px;
    background-position: 0 0, 2px 2px;
  }

  .window {
    max-width: 1100px;
    margin: 24px auto;
    border: 2px solid var(--shadow-deep);
    box-shadow: var(--bevel-out), 4px 4px 12px rgba(0,0,0,0.25);
    background: var(--panel);
  }

  .title-bar {
    background: linear-gradient(180deg, #7a64b8 0%, var(--purple) 40%, var(--purple-dim) 100%);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid var(--shadow-deep);
    user-select: none;
  }

  .title-btn {
    width: 14px;
    height: 14px;
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: inset -1px -1px 0 rgba(0,0,0,0.3), inset 1px 1px 0 rgba(255,255,255,0.3);
  }

  .btn-close { background: #e05050; }
  .btn-min { background: #d4952a; }
  .btn-max { background: #50a850; }

  .title-text {
    flex: 1;
    text-align: center;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* ── Header ── */
  .header {
    padding: 20px 24px 16px;
    background: var(--panel-light);
    border-bottom: 2px solid var(--shadow);
    box-shadow: inset 0 -1px 0 var(--highlight);
  }

  .header h1 {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: 0.5px;
  }

  .header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }

  .header .meta {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.5px;
  }

  .meta-val { color: var(--purple); font-weight: 600; }
  .meta-label { color: var(--text-dim); }

  /* ── Search ── */
  .search-wrap {
    padding: 10px 24px;
    background: var(--panel);
    border-bottom: 2px solid var(--shadow);
    box-shadow: inset 0 -1px 0 var(--highlight);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .search-inner {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .search-box {
    flex: 1;
    background: #fff;
    border: none;
    box-shadow: var(--bevel-in);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
  }

  .search-box::placeholder { color: #a09888; }
  .search-box:focus { box-shadow: var(--bevel-in), 0 0 0 2px rgba(123,97,255,0.3); }

  .search-stats {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
    display: none;
  }

  .search-stats.active { display: block; }

  /* ── Category nav ── */
  .cat-nav {
    display: flex;
    gap: 2px;
    padding: 8px 24px;
    background: var(--panel);
    border-bottom: 2px solid var(--shadow);
    box-shadow: inset 0 -1px 0 var(--highlight);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .cat-nav::-webkit-scrollbar { display: none; }

  .cat-btn {
    background: var(--panel-light);
    border: none;
    box-shadow: var(--bevel-out-sm);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
    min-height: 44px;
    display: flex;
    align-items: center;
  }

  .cat-btn:hover {
    background: var(--highlight);
    color: var(--text);
  }

  .cat-btn:active, .cat-btn.active {
    box-shadow: var(--bevel-in);
    background: var(--bg-warm);
    color: var(--purple);
    font-weight: 700;
  }

  /* ── Content ── */
  .content { padding: 16px 24px 40px; }

  /* ── Section ── */
  .section { margin-top: 24px; }

  .section-bar {
    background: linear-gradient(180deg, #7a64b8 0%, var(--purple) 50%, var(--purple-dim) 100%);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 2px solid var(--shadow-deep);
    box-shadow: var(--bevel-out-sm);
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }

  .section-bar:hover { filter: brightness(1.05); }

  .section-icon { font-size: 16px; }

  .section-title {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  .section-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,0.6);
  }

  .section-toggle {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    transition: transform 0.2s;
  }

  .section.collapsed .section-toggle { transform: rotate(-90deg); }
  .section.collapsed .entry-list { display: none; }

  /* ── Entry rows ── */
  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .entry-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 8px 12px;
    background: var(--panel-light);
    border: 1px solid var(--shadow);
    box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--highlight);
    transition: background 0.15s;
    min-height: 44px;
  }

  .entry-row:hover { background: #eee8dc; }

  .entry-cmd-wrap {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    min-width: 0;
    flex: 1;
    max-width: 55%;
  }

  .entry-cmd {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--purple-dim);
    background: linear-gradient(180deg, #f0ece4 0%, #d4d0c6 40%, #c8c0b4 100%);
    border: 1px solid var(--shadow);
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 var(--shadow-deep), 0 1px 2px rgba(0,0,0,0.2);
    border-radius: 3px;
    padding: 3px 8px;
    word-break: break-all;
    white-space: pre-wrap;
    line-height: 1.4;
    flex: 1;
    min-width: 0;
  }

  .copy-btn {
    background: var(--panel);
    border: 1px solid var(--shadow);
    box-shadow: var(--bevel-out-sm);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 9px;
    padding: 3px 7px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    min-height: 24px;
    transition: background 0.15s, color 0.15s;
  }

  .copy-btn:hover { background: var(--highlight); color: var(--purple); }
  .copy-btn:active { box-shadow: var(--bevel-in); }
  .copy-btn.copied { color: var(--gold); }

  .entry-body {
    flex: 1;
    min-width: 0;
  }

  .entry-desc {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text);
    line-height: 1.4;
  }

  .entry-notes {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.4;
    margin-top: 2px;
  }

  .entry-tags {
    display: flex;
    gap: 4px;
    margin-top: 3px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 1px 5px;
    border: 1px solid;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .tag-sudo { color: var(--red); border-color: rgba(192,64,64,0.4); background: rgba(192,64,64,0.08); }
  .tag-kandji { color: var(--purple-bright); border-color: rgba(123,97,255,0.4); background: rgba(123,97,255,0.08); }
  .tag-default { color: var(--cyan); border-color: rgba(42,138,138,0.4); background: rgba(42,138,138,0.08); }

  /* ── Footer ── */
  .footer {
    background: var(--panel-light);
    border-top: 2px solid var(--shadow);
    box-shadow: inset 0 1px 0 var(--highlight);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  mark {
    background: rgba(123, 97, 255, 0.2);
    color: var(--purple-dim);
    padding: 0 2px;
    border-radius: 1px;
  }

  .hidden { display: none !important; }

  /* ── Reference table ── */
  .ref-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 11px;
    margin-top: 4px;
  }

  .ref-table th {
    background: var(--panel-dark);
    color: var(--text);
    font-weight: 700;
    text-align: left;
    padding: 4px 8px;
    border: 1px solid var(--shadow);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .ref-table td {
    padding: 4px 8px;
    border: 1px solid var(--shadow);
    background: var(--panel-light);
    color: var(--text);
  }

  .ref-table tr:hover td { background: #eee8dc; }

  @media (max-width: 700px) {
    .window { margin: 0; border-left: none; border-right: none; }
    .header, .content, .search-wrap, .cat-nav, .footer { padding-left: 12px; padding-right: 12px; }
    .entry-row { flex-direction: column; gap: 6px; }
    .entry-cmd-wrap { max-width: 100%; }
  }

  /* ─────────── Command Palette ─────────── */
  .cmdp-overlay {
    display: none; position: fixed; inset: 0; z-index: 10000;
    background: rgba(62,50,96,0.5);
    align-items: flex-start; justify-content: center;
    padding-top: 10vh;
  }
  .cmdp-overlay.show { display: flex; }
  .cmdp {
    width: min(660px, 92vw); max-height: 70vh;
    background: var(--panel-light); border: 2px solid var(--shadow-deep);
    box-shadow: var(--bevel-out), 0 24px 80px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    font-family: var(--mono); color: var(--text);
  }
  .cmdp-input-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--shadow);
    background: var(--panel);
  }
  .cmdp-prompt { color: var(--purple); font-weight: 700; font-size: 16px; }
  .cmdp-input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); font-family: var(--mono); font-size: 13px;
  }
  .cmdp-input::placeholder { color: var(--text-dim); }
  .cmdp-hint {
    font-size: 9px; color: var(--text-dim); padding: 2px 6px;
    border: 1px solid var(--shadow); letter-spacing: 1px;
    background: var(--panel);
  }
  .cmdp-results { flex: 1; overflow-y: auto; padding: 4px 0; background: var(--panel-light); }
  .cmdp-row {
    padding: 8px 16px; cursor: pointer;
    border-left: 3px solid transparent;
    display: flex; flex-direction: column; gap: 2px;
  }
  .cmdp-row:hover, .cmdp-row.active {
    background: rgba(123,97,255,0.08); border-left-color: var(--purple-bright);
  }
  .cmdp-row-title {
    font-size: 12px; color: var(--text); font-weight: 700;
    display: flex; align-items: center; gap: 8px; font-family: var(--sans);
  }
  .cmdp-row-cat {
    font-size: 8px; padding: 1px 6px; border: 1px solid var(--shadow);
    color: var(--purple); letter-spacing: 1px; text-transform: uppercase;
    background: rgba(123,97,255,0.06);
  }
  .cmdp-row-cmd { font-size: 10px; color: var(--purple-bright); line-height: 1.4; }
  .cmdp-row-desc { font-size: 10px; color: var(--text-dim); line-height: 1.4; }
  .cmdp-empty {
    padding: 24px 16px; text-align: center; color: var(--text-dim); font-size: 11px; font-family: var(--sans);
  }
  .cmdp-foot {
    display: flex; gap: 14px; align-items: center;
    padding: 8px 16px; border-top: 1px solid var(--shadow);
    background: var(--panel);
    font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px; font-family: var(--sans);
  }
  .cmdp-foot kbd {
    font-family: var(--mono); padding: 1px 5px;
    border: 1px solid var(--shadow); color: var(--purple); font-size: 9px;
  }
  .cmdp-foot-spacer { flex: 1; }
  .cmdp-count { color: var(--purple); }
  .cmdp-flash { animation: cmdpFlash 500ms ease-out; }
  @keyframes cmdpFlash {
    0%   { background: rgba(123,97,255,0.15); }
    100% { background: transparent; }
  }
</style>
</head>
<body>

<div class="window" id="app">
  <div class="title-bar">
    <div class="title-btn btn-close"></div>
    <div class="title-btn btn-min"></div>
    <div class="title-btn btn-max"></div>
    <div class="title-text">macOS Field Guide</div>
    <div class="title-btn btn-max"></div>
    <div class="title-btn btn-min"></div>
    <div class="title-btn btn-close"></div>
  </div>

  <div class="header">
    <h1>macOS Administration Field Guide</h1>
    <div class="subtitle">macOS 13+ (Ventura → Sequoia) · Kandji / Entra ID / ABM · Endpoint Engineering</div>
    <div class="meta">
      <span><span class="meta-val" id="total-count">0</span> <span class="meta-label">commands</span></span>
      <span><span class="meta-val" id="cat-count">0</span> <span class="meta-label">categories</span></span>
      <span><span class="meta-label">updated</span> <span class="meta-val">2026-04-02</span></span>
    </div>
  </div>

  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-label">Find:</span>
      <input type="text" class="search-box" id="search" placeholder="Search commands, descriptions, notes, tags..." autocomplete="off" spellcheck="false">
    </div>
    <div class="search-stats" id="search-stats"></div>
  </div>

  <nav class="cat-nav" id="cat-nav"></nav>

  <div class="content" id="content"></div>

  <div class="footer">
    <span>MACOS FIELD GUIDE · 2026</span>
    <span>PRESS / TO SEARCH · ESC TO CLEAR</span>
  </div>
</div>

<script>
const CATEGORY_META = [
  { id: "kandji",    icon: "📱", label: "Kandji / MDM" },
  { id: "disk",      icon: "💾", label: "Disk & Storage" },
  { id: "network",   icon: "🌐", label: "Network" },
  { id: "sysinfo",   icon: "🖥", label: "System Info" },
  { id: "user",      icon: "👤", label: "User & Identity" },
  { id: "logs",      icon: "📋", label: "Logs & Diagnostics" },
  { id: "launch",    icon: "⚙", label: "Launch & Services" },
  { id: "security",  icon: "🔒", label: "Security" },
  { id: "software",  icon: "📦", label: "Software" },
  { id: "internals", icon: "🧬", label: "Deep System Internals" },
  { id: "reference", icon: "📖", label: "Reference Tables" },
];

const ENTRIES = [
  // ── KANDJI / MDM ──
  { category: "kandji", cmd: "sudo profiles list -verbose", desc: "List all installed configuration profiles with full detail", notes: "Requires root. Shows MDM, Wi-Fi, VPN, certificate profiles", tags: ["mdm", "profiles"] },
  { category: "kandji", cmd: "sudo profiles show -type enrollment", desc: "Show MDM enrollment profile details", notes: "Confirms DEP/ADE vs manual enrollment", tags: ["mdm", "enrollment"] },
  { category: "kandji", cmd: "sudo profiles remove -identifier {profile-id}", desc: "Remove a specific configuration profile by identifier", notes: "Post-macOS 12: MDM-installed profiles require a removal token", tags: ["mdm", "profiles"] },
  { category: "kandji", cmd: "sudo profiles renew -type enrollment", desc: "Renew the MDM enrollment profile", notes: "Useful when enrollment is stale or certificate is expiring", tags: ["mdm", "enrollment"] },
  { category: "kandji", cmd: "log show --predicate 'subsystem == \"com.apple.ManagedClient\"' --last 1h", desc: "Show MDM client logs from the last hour", notes: "Filter by subsystem for cleaner output. Adjust time window as needed", tags: ["mdm", "logs"] },
  { category: "kandji", cmd: "log show --predicate 'process == \"mdmclient\"' --last 30m --info", desc: "Show mdmclient process logs including info-level messages", notes: "Catches check-in events, profile installs, command responses", tags: ["mdm", "logs"] },
  { category: "kandji", cmd: "sudo /usr/libexec/mdmclient QueryDeviceInformation", desc: "Query device info as reported to MDM server", notes: "Returns serial, UDID, OS version, battery, storage", tags: ["mdm", "diagnostics"] },
  { category: "kandji", cmd: "sudo /usr/libexec/mdmclient QuerySecurityInfo", desc: "Query security posture reported to MDM", notes: "Shows FileVault status, firewall, SIP, firmware password state", tags: ["mdm", "security"] },
  { category: "kandji", cmd: "ls -la /var/kandji/", desc: "List Kandji agent directory contents", notes: "Contains agent binary, logs, cache. Verify agent is installed", tags: ["kandji", "agent"] },
  { category: "kandji", cmd: "cat /var/kandji/log/agent.log | tail -100", desc: "Tail the Kandji agent log", notes: "Check for audit/remediation runs, parameter execution, errors", tags: ["kandji", "logs"] },
  { category: "kandji", cmd: "sudo launchctl list | grep kandji", desc: "Check if Kandji launch daemons are loaded", notes: "Should show io.kandji.KandjiAgent and related services", tags: ["kandji", "agent"] },
  { category: "kandji", cmd: "defaults read /Library/Preferences/com.apple.mdmclient", desc: "Read MDM client preferences", notes: "Shows server URL, check-in interval, last check-in time", tags: ["mdm", "preferences"] },

  // ── DISK & STORAGE ──
  { category: "disk", cmd: "diskutil list", desc: "List all disks, partitions, and APFS volumes", notes: "Shows synthesized (APFS container) and physical disk layout", tags: ["disk", "apfs"] },
  { category: "disk", cmd: "diskutil info /", desc: "Show detailed info for the boot volume", notes: "Includes filesystem type, UUID, capacity, encryption status", tags: ["disk", "info"] },
  { category: "disk", cmd: "diskutil apfs list", desc: "List APFS containers and their volumes", notes: "Shows roles (System, Data, Preboot, Recovery, VM)", tags: ["disk", "apfs"] },
  { category: "disk", cmd: "diskutil verifyVolume /", desc: "Run First Aid verification on the boot volume", notes: "Non-destructive check. Use repairVolume for fixes (requires recovery for boot vol)", tags: ["disk", "repair"] },
  { category: "disk", cmd: "sudo diskutil repairVolume /", desc: "Repair filesystem on the boot volume", notes: "May require booting to Recovery for the system volume", tags: ["disk", "repair"] },
  { category: "disk", cmd: "tmutil listlocalsnapshots /", desc: "List local Time Machine APFS snapshots", notes: "Snapshots consume space; delete stale ones with thinlocalsnapshots", tags: ["disk", "timemachine"] },
  { category: "disk", cmd: "sudo tmutil thinlocalsnapshots / 10000000000 4", desc: "Purge local snapshots to reclaim ~10GB", notes: "Second arg is bytes to free, third is urgency (1-4, 4=most aggressive)", tags: ["disk", "timemachine"] },
  { category: "disk", cmd: "df -h", desc: "Show filesystem disk space usage in human-readable format", notes: "Check /System/Volumes/Data for actual user data volume", tags: ["disk", "usage"] },
  { category: "disk", cmd: "du -sh ~/Library/Caches/*", desc: "Show cache directory sizes", notes: "Common culprit for disk space issues. Safe to clear most app caches", tags: ["disk", "usage"] },
  { category: "disk", cmd: "diskutil mount /dev/disk2s1", desc: "Mount a specific volume by disk identifier", notes: "Get identifier from diskutil list. Use unmount to eject", tags: ["disk", "mount"] },

// ── Render ──
(function() {
  const catNav = document.getElementById('cat-nav');
  const content = document.getElementById('content');
  const totalEntries = ENTRIES.filter(e => !e.cmd.startsWith('#')).length;
  const totalAll = ENTRIES.length;

  document.getElementById('total-count').textContent = totalEntries;
  document.getElementById('cat-count').textContent = CATEGORY_META.length;

  // Build category nav
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn active';
  allBtn.dataset.cat = 'all';
  allBtn.textContent = 'ALL';
  catNav.appendChild(allBtn);

  CATEGORY_META.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.cat = cat.id;
    btn.textContent = cat.label.toUpperCase();
    catNav.appendChild(btn);
  });

  // Build sections
  CATEGORY_META.forEach(cat => {
    const entries = ENTRIES.filter(e => e.category === cat.id);
    if (!entries.length) return;

    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.dataset.cat = cat.id;

    const cmdCount = entries.filter(e => !e.cmd.startsWith('#')).length;

    secEl.innerHTML = '<div class="section-bar">' +
      '<span class="section-icon">' + cat.icon + '</span>' +
      '<span class="section-title">' + cat.label + '</span>' +
      '<span class="section-count">' + cmdCount + ' commands</span>' +
      '<span class="section-toggle">▼</span>' +
    '</div>';

    const list = document.createElement('div');
    list.className = 'entry-list';

    entries.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'entry-row';

      const isRef = entry.cmd.startsWith('#');
      const searchText = (entry.cmd + ' ' + entry.desc + ' ' + (entry.notes || '') + ' ' + (entry.tags || []).join(' ')).toLowerCase();
      row.dataset.keywords = searchText;

      if (isRef) {
        row.innerHTML = '<div style="width:100%">' +
          '<div style="font-family:var(--sans);font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px;letter-spacing:0.5px">' + entry.cmd.slice(2) + '</div>' +
          '<div>' + entry.desc + '</div>' +
        '</div>';
      } else {
        const tagsHtml = (entry.tags || []).map(t => {
          const cls = t === 'sudo' ? 'tag-sudo' : t === 'kandji' ? 'tag-kandji' : 'tag-default';
          return '<span class="tag ' + cls + '">' + t + '</span>';
        }).join('');

        row.innerHTML = '<div class="entry-cmd-wrap">' +
          '<code class="entry-cmd">' + escHtml(entry.cmd) + '</code>' +
          '<button class="copy-btn" data-cmd="' + escAttr(entry.cmd) + '">COPY</button>' +
        '</div>' +
        '<div class="entry-body">' +
          '<div class="entry-desc">' + escHtml(entry.desc) + '</div>' +
          (entry.notes ? '<div class="entry-notes">' + escHtml(entry.notes) + '</div>' : '') +
          (tagsHtml ? '<div class="entry-tags">' + tagsHtml + '</div>' : '') +
        '</div>';
      }

      list.appendChild(row);
    });

    secEl.appendChild(list);
    content.appendChild(secEl);

    // Collapse toggle
    secEl.querySelector('.section-bar').addEventListener('click', function() {
      secEl.classList.toggle('collapsed');
    });
  });

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── Copy buttons ──
  content.addEventListener('click', function(e) {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const cmd = btn.getAttribute('data-cmd');
    navigator.clipboard.writeText(cmd).then(function() {
      btn.textContent = 'COPIED';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1200);
    });
  });

  // ── Category nav ──
  const catBtns = catNav.querySelectorAll('.cat-btn');
  const sections = content.querySelectorAll('.section');

  catBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var cat = btn.dataset.cat;
      catBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      sections.forEach(function(sec) {
        sec.classList.toggle('hidden', cat !== 'all' && sec.dataset.cat !== cat);
      });
      document.getElementById('search').value = '';
      content.querySelectorAll('.entry-row').forEach(function(r) { r.classList.remove('hidden'); });
      document.getElementById('search-stats').classList.remove('active');
    });
  });

  // ── Search ──
  var searchInput = document.getElementById('search');
  var searchStats = document.getElementById('search-stats');

  searchInput.addEventListener('input', function() {
    var q = searchInput.value.toLowerCase().trim();
    var allRows = content.querySelectorAll('.entry-row');

    if (!q) {
      allRows.forEach(function(r) { r.classList.remove('hidden'); });
      sections.forEach(function(s) { s.classList.remove('hidden'); });
      searchStats.classList.remove('active');
      var activeCat = catNav.querySelector('.cat-btn.active').dataset.cat;
      if (activeCat !== 'all') {
        sections.forEach(function(s) { if (s.dataset.cat !== activeCat) s.classList.add('hidden'); });
      }
      return;
    }

    catBtns.forEach(function(b) { b.classList.remove('active'); });
    catNav.querySelector('[data-cat="all"]').classList.add('active');
    sections.forEach(function(s) { s.classList.remove('hidden'); });

    var terms = q.split(/\s+/);
    var visible = 0;

    allRows.forEach(function(row) {
      var text = row.dataset.keywords;
      var match = terms.every(function(t) { return text.includes(t); });
      row.classList.toggle('hidden', !match);
      if (match) visible++;
    });

    sections.forEach(function(sec) {
      var hasVisible = sec.querySelectorAll('.entry-row:not(.hidden)').length > 0;
      sec.classList.toggle('hidden', !hasVisible);
    });

    searchStats.textContent = visible + ' of ' + totalAll + ' entries';
    searchStats.classList.add('active');
  });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && document.activeElement !== searchInput && !cmdpOpen()) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.blur();
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
    }
  });

  // ── Command Palette ──
  var cmdpEl = document.createElement('div');
  cmdpEl.className = 'cmdp-overlay';
  cmdpEl.id = 'cmdp-overlay';
  cmdpEl.innerHTML =
    '<div class="cmdp">' +
    '<div class="cmdp-input-row">' +
    '<span class="cmdp-prompt">&#62;</span>' +
    '<input type="text" class="cmdp-input" id="cmdp-input" placeholder="Type to search\u2026 ($ or > to copy first match)" autocomplete="off" spellcheck="false">' +
    '<span class="cmdp-hint">ESC</span>' +
    '</div>' +
    '<div class="cmdp-results" id="cmdp-results"></div>' +
    '<div class="cmdp-foot">' +
    '<span><kbd>&#8593;&#8595;</kbd> navigate</span>' +
    '<span><kbd>&#8629;</kbd> jump</span>' +
    '<span><kbd>$</kbd> copy</span>' +
    '<span class="cmdp-foot-spacer"></span>' +
    '<span class="cmdp-count" id="cmdp-count"></span>' +
    '</div></div>';
  document.body.appendChild(cmdpEl);

  var cmdpOverlay = document.getElementById('cmdp-overlay');
  var cmdpInput = document.getElementById('cmdp-input');
  var cmdpResults = document.getElementById('cmdp-results');
  var cmdpCount = document.getElementById('cmdp-count');
  var cmdpOpen = function() { return cmdpOverlay.classList.contains('show'); };
  var cmdpIdx = 0;
  var cmdpRows = [];

  var palIndex = ENTRIES.filter(function(e) { return !e.cmd.startsWith('#'); }).map(function(e) {
    return {
      title: e.desc,
      cmd: e.cmd,
      cat: e.category,
      hay: (e.cmd + ' ' + e.desc + ' ' + (e.notes || '') + ' ' + (e.tags || []).join(' ')).toLowerCase(),
    };
  });

  function palFuzzy(query, text) {
    if (!query) return 0;
    var q = query.toLowerCase(), t = text.toLowerCase();
    if (t.includes(q)) return 100 + (t.startsWith(q) ? 20 : 0);
    var qi = 0, score = 0, consec = 0;
    for (var i = 0; i < t.length && qi < q.length; i++) {
      if (t[i] === q[qi]) { score += 1 + consec * 5; if (i === 0 || /[\s\-_./]/.test(t[i-1])) score += 10; consec++; qi++; }
      else consec = 0;
    }
    if (qi < q.length) return 0;
    return score + 50 + Math.max(0, 30 - t.length);
  }

  function cmdpRender() {
    var raw = cmdpInput.value.trim();
    var copyMode = raw.charAt(0) === '$' || raw.charAt(0) === '>';
    var q = copyMode ? raw.slice(1).trim() : raw;
    cmdpResults.innerHTML = '';
    if (!q) {
      cmdpResults.innerHTML = '<div class="cmdp-empty">Type to search ' + palIndex.length + ' commands</div>';
      cmdpCount.textContent = '';
      cmdpRows = [];
      return;
    }
    var scored = palIndex
      .map(function(it) { return { it: it, score: palFuzzy(q, it.hay) }; })
      .filter(function(s) { return s.score >= 20; })
      .sort(function(a,b) { return b.score - a.score; })
      .slice(0, 15);
    cmdpRows = scored.map(function(s) { return s.it; });
    cmdpCount.textContent = scored.length + (copyMode ? ' · COPY' : '');
    if (!scored.length) { cmdpResults.innerHTML = '<div class="cmdp-empty">No matches</div>'; return; }
    var esc = function(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
    scored.forEach(function(s, i) {
      var row = document.createElement('div');
      row.className = 'cmdp-row' + (i === 0 ? ' active' : '');
      row.innerHTML =
        '<div class="cmdp-row-title"><span>' + esc(s.it.title) + '</span>' +
        (s.it.cat ? '<span class="cmdp-row-cat">' + s.it.cat + '</span>' : '') + '</div>' +
        '<div class="cmdp-row-cmd">' + esc(s.it.cmd) + '</div>';
      row.addEventListener('click', function() { cmdpActivate(i); });
      row.addEventListener('mouseenter', function() { cmdpIdx = i; cmdpHighlight(); });
      cmdpResults.appendChild(row);
    });
    cmdpIdx = 0;
  }
  function cmdpHighlight() {
    Array.from(cmdpResults.children).forEach(function(c, i) { c.classList.toggle('active', i === cmdpIdx); });
    if (cmdpResults.children[cmdpIdx]) cmdpResults.children[cmdpIdx].scrollIntoView({ block: 'nearest' });
  }
  function cmdpActivate(i) {
    var it = cmdpRows[i];
    if (!it) return;
    var raw = cmdpInput.value.trim();
    if (raw.charAt(0) === '$' || raw.charAt(0) === '>') {
      navigator.clipboard.writeText(it.cmd);
      cmdpClose();
      return;
    }
    cmdpClose();
    // Find matching entry-row and scroll to it
    var rows = content.querySelectorAll('.entry-row');
    for (var j = 0; j < rows.length; j++) {
      if ((rows[j].dataset.keywords || '').includes(it.cmd.toLowerCase().slice(0, 30))) {
        var sec = rows[j].closest('.section');
        if (sec) { sec.classList.remove('hidden', 'collapsed'); }
        rows[j].classList.remove('hidden');
        rows[j].scrollIntoView({ behavior: 'smooth', block: 'center' });
        rows[j].classList.add('cmdp-flash');
        setTimeout(function(r) { return function() { r.classList.remove('cmdp-flash'); }; }(rows[j]), 600);
        break;
      }
    }
  }
  function cmdpShow() { cmdpOverlay.classList.add('show'); cmdpInput.value = ''; cmdpRender(); setTimeout(function() { cmdpInput.focus(); }, 0); }
  function cmdpClose() { cmdpOverlay.classList.remove('show'); }
  cmdpInput.addEventListener('input', cmdpRender);
  cmdpInput.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (cmdpIdx < cmdpRows.length - 1) { cmdpIdx++; cmdpHighlight(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (cmdpIdx > 0) { cmdpIdx--; cmdpHighlight(); } }
    else if (e.key === 'Enter') { e.preventDefault(); cmdpActivate(cmdpIdx); }
    else if (e.key === 'Escape') { e.preventDefault(); cmdpClose(); }
  });
  cmdpOverlay.addEventListener('click', function(e) { if (e.target === cmdpOverlay) cmdpClose(); });
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      if (cmdpOpen()) cmdpClose(); else cmdpShow();
    }
  });
})();
</script>
</body>
</html>
