<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows Keyboard Shortcut Cheatsheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --bg: #b8ae9c;
    --bg-warm: #c5bdb0;
    --panel: #d8d2c6;
    --panel-light: #e6e1d7;
    --panel-dark: #a89e8e;
    --highlight: #f0ece4;
    --shadow: #8a8070;
    --shadow-deep: #6e655a;
    --purple: #5c4a8a;
    --purple-bright: #7b61ff;
    --purple-light: #9b88cc;
    --purple-dim: #3e3260;
    --gold: #d4952a;
    --gold-light: #f0c060;
    --red: #c04040;
    --cyan: #2a8a8a;
    --text: #1e1b18;
    --text-dim: #6b6358;
    --text-light: #f0ece4;
    --mono: 'IBM Plex Mono', 'Courier New', 'Menlo', 'Consolas', monospace;
    --sans: 'IBM Plex Sans', 'Lucida Grande', 'Geneva', 'Helvetica', sans-serif;
    --bevel-out: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--highlight), inset -2px -2px 0 var(--shadow-deep), inset 2px 2px 0 #f8f5f0;
    --bevel-in: inset 1px 1px 0 var(--shadow), inset -1px -1px 0 var(--highlight), inset 2px 2px 0 var(--shadow-deep), inset -2px -2px 0 #f8f5f0;
    --bevel-out-sm: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--highlight);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    /* Subtle crosshatch texture */
    background-image:
      linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%),
      linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%);
    background-size: 4px 4px;
    background-position: 0 0, 2px 2px;
  }

  /* ── Window chrome ── */
  .window {
    max-width: 1100px;
    margin: 24px auto;
    border: 2px solid var(--shadow-deep);
    box-shadow: var(--bevel-out), 4px 4px 12px rgba(0,0,0,0.25);
    background: var(--panel);
  }

  .title-bar {
    background: linear-gradient(180deg, #7a64b8 0%, var(--purple) 40%, var(--purple-dim) 100%);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 2px solid var(--shadow-deep);
    user-select: none;
  }

  .title-btn {
    width: 14px;
    height: 14px;
    border: 1px solid rgba(0,0,0,0.4);
    box-shadow: inset -1px -1px 0 rgba(0,0,0,0.3), inset 1px 1px 0 rgba(255,255,255,0.3);
  }

  .btn-close { background: #e05050; }
  .btn-min { background: #d4952a; }
  .btn-max { background: #50a850; }

  .title-text {
    flex: 1;
    text-align: center;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* ── Header ── */
  .header {
    padding: 20px 24px 16px;
    background: var(--panel-light);
    border-bottom: 2px solid var(--shadow);
    box-shadow: inset 0 -1px 0 var(--highlight);
  }

  .header h1 {
    font-family: var(--sans);
    font-size: 22px;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: 0.5px;
  }

  .header .subtitle {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }

  .header .meta {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.5px;
  }

  .meta-val { color: var(--purple); font-weight: 600; }
  .meta-label { color: var(--text-dim); }

  /* ── Search ── */
  .search-wrap {
    padding: 10px 24px;
    background: var(--panel);
    border-bottom: 2px solid var(--shadow);
    box-shadow: inset 0 -1px 0 var(--highlight);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .search-inner {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .search-label {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .search-box {
    flex: 1;
    background: #fff;
    border: none;
    box-shadow: var(--bevel-in);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
  }

  .search-box::placeholder { color: #a09888; }
  .search-box:focus { box-shadow: var(--bevel-in), 0 0 0 2px rgba(123,97,255,0.3); }

  .search-stats {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 6px;
    display: none;
  }

  .search-stats.active { display: block; }

  /* ── Category nav ── */
  .cat-nav {
    display: flex;
    gap: 2px;
    padding: 8px 24px;
    background: var(--panel);
    border-bottom: 2px solid var(--shadow);
    box-shadow: inset 0 -1px 0 var(--highlight);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .cat-nav::-webkit-scrollbar { display: none; }

  .cat-btn {
    background: var(--panel-light);
    border: none;
    box-shadow: var(--bevel-out-sm);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }

  .cat-btn:hover {
    background: var(--highlight);
    color: var(--text);
  }

  .cat-btn:active, .cat-btn.active {
    box-shadow: var(--bevel-in);
    background: var(--bg-warm);
    color: var(--purple);
    font-weight: 700;
  }

  /* ── Content ── */
  .content { padding: 16px 24px 40px; }

  /* ── Section ── */
  .section { margin-top: 24px; }

  .section-bar {
    background: linear-gradient(180deg, #7a64b8 0%, var(--purple) 50%, var(--purple-dim) 100%);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 2px solid var(--shadow-deep);
    box-shadow: var(--bevel-out-sm);
    margin-bottom: 12px;
  }

  .section-icon { font-size: 16px; }

  .section-title {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  .section-count {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: rgba(255,255,255,0.6);
  }

  /* ── Shortcut grid ── */
  .shortcut-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 3px;
  }

  .shortcut-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: var(--panel-light);
    border: 1px solid var(--shadow);
    box-shadow: inset -1px -1px 0 var(--shadow), inset 1px 1px 0 var(--highlight);
    transition: background 0.15s;
    min-height: 34px;
  }

  .shortcut-row:hover {
    background: #eee8dc;
  }

  .keys {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    min-width: 120px;
    justify-content: flex-end;
  }

  .key {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 22px;
    padding: 0 6px;
    background: linear-gradient(180deg, #f0ece4 0%, #d4d0c6 40%, #c8c0b4 100%);
    border: 1px solid var(--shadow);
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 var(--shadow-deep), 0 1px 2px rgba(0,0,0,0.2);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--purple-dim);
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .key-plus {
    font-size: 9px;
    color: var(--text-dim);
    margin: 0 1px;
  }

  .desc {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }

  .tag {
    font-family: var(--mono);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 1px 5px;
    border: 1px solid;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .tag-win11 { color: var(--purple-bright); border-color: rgba(123,97,255,0.4); background: rgba(123,97,255,0.08); }
  .tag-admin { color: var(--red); border-color: rgba(192,64,64,0.4); background: rgba(192,64,64,0.08); }
  .tag-terminal { color: var(--cyan); border-color: rgba(42,138,138,0.4); background: rgba(42,138,138,0.08); }

  /* ── Divider in grid ── */
  .sub-header {
    grid-column: 1 / -1;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 10px 4px;
    border-bottom: 1px solid var(--shadow);
  }

  /* ── Footer ── */
  .footer {
    background: var(--panel-light);
    border-top: 2px solid var(--shadow);
    box-shadow: inset 0 1px 0 var(--highlight);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  /* ── Highlight ── */
  mark {
    background: rgba(123, 97, 255, 0.2);
    color: var(--purple-dim);
    padding: 0 2px;
    border-radius: 1px;
  }

  .hidden { display: none !important; }

  @media (max-width: 700px) {
    .window { margin: 0; border-left: none; border-right: none; }
    .shortcut-grid { grid-template-columns: 1fr; }
    .header, .content, .search-wrap, .cat-nav, .footer { padding-left: 12px; padding-right: 12px; }
    .keys { min-width: 90px; }
  }

  /* ─────────── Command Palette ─────────── */
  .cmdp-overlay {
    display: none; position: fixed; inset: 0; z-index: 10000;
    background: rgba(62,50,96,0.5);
    align-items: flex-start; justify-content: center;
    padding-top: 10vh;
  }
  .cmdp-overlay.show { display: flex; }
  .cmdp {
    width: min(660px, 92vw); max-height: 70vh;
    background: var(--panel-light); border: 2px solid var(--shadow-deep);
    box-shadow: var(--bevel-out), 0 24px 80px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    font-family: var(--mono); color: var(--text);
  }
  .cmdp-input-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--shadow);
    background: var(--panel);
  }
  .cmdp-prompt { color: var(--purple); font-weight: 700; font-size: 14px; }
  .cmdp-input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); font-family: var(--mono); font-size: 13px;
  }
  .cmdp-input::placeholder { color: var(--text-dim); }
  .cmdp-hint {
    font-size: 9px; color: var(--text-dim); padding: 2px 6px;
    border: 1px solid var(--shadow); letter-spacing: 1px; background: var(--panel);
  }
  .cmdp-results { flex: 1; overflow-y: auto; padding: 4px 0; background: var(--panel-light); }
  .cmdp-row {
    padding: 8px 16px; cursor: pointer;
    border-left: 3px solid transparent;
    display: flex; align-items: center; gap: 12px;
  }
  .cmdp-row:hover, .cmdp-row.active {
    background: rgba(123,97,255,0.08); border-left-color: var(--purple-bright);
  }
  .cmdp-row-desc { font-size: 12px; color: var(--text); flex: 1; font-family: var(--sans); }
  .cmdp-row-cat {
    font-size: 8px; padding: 1px 6px; border: 1px solid var(--shadow);
    color: var(--purple); letter-spacing: 1px; text-transform: uppercase;
    background: rgba(123,97,255,0.06); flex-shrink: 0;
  }
  .cmdp-empty {
    padding: 24px 16px; text-align: center; color: var(--text-dim); font-size: 11px; font-family: var(--sans);
  }
  .cmdp-foot {
    display: flex; gap: 14px; align-items: center;
    padding: 8px 16px; border-top: 1px solid var(--shadow);
    background: var(--panel);
    font-size: 9px; color: var(--text-dim); letter-spacing: 0.5px; font-family: var(--sans);
  }
  .cmdp-foot kbd {
    font-family: var(--mono); padding: 1px 5px;
    border: 1px solid var(--shadow); color: var(--purple); font-size: 9px;
  }
  .cmdp-foot-spacer { flex: 1; }
  .cmdp-count { color: var(--purple); }
  .cmdp-flash-row { background: rgba(123,97,255,0.12) !important; transition: background 500ms; }
</style>
</head>

// ── Render ──
(function() {
  const catNav = document.getElementById('cat-nav');
  const content = document.getElementById('content');
  let totalCount = 0;

  // Count shortcuts
  DATA.forEach(sec => {
    sec.items.forEach(item => { if (!item.sub) totalCount++; });
  });
  document.getElementById('total-count').textContent = totalCount;

  // Build category nav
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn active';
  allBtn.dataset.cat = 'all';
  allBtn.textContent = 'ALL';
  catNav.appendChild(allBtn);

  DATA.forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.cat = sec.id;
    btn.textContent = sec.label.toUpperCase().split('/')[0].trim();
    catNav.appendChild(btn);
  });

  // Build sections
  DATA.forEach(sec => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.dataset.cat = sec.id;

    const count = sec.items.filter(i => !i.sub).length;

    secEl.innerHTML = `<div class="section-bar">
      <span class="section-icon">${sec.icon}</span>
      <span class="section-title">${sec.label}</span>
      <span class="section-count">${count} shortcuts</span>
    </div>`;

    const grid = document.createElement('div');
    grid.className = 'shortcut-grid';

    sec.items.forEach(item => {
      if (item.sub) {
        const sh = document.createElement('div');
        sh.className = 'sub-header';
        sh.textContent = item.sub;
        grid.appendChild(sh);
        return;
      }

      const row = document.createElement('div');
      row.className = 'shortcut-row';
      row.dataset.keywords = (item.d + ' ' + item.k.join(' ')).toLowerCase();

      const keysHtml = item.k.map(k => `<span class="key">${k}</span>`).join('<span class="key-plus">+</span>');
      const tagHtml = item.t ? `<span class="tag tag-${item.t}">${item.t === 'win11' ? 'WIN 11' : item.t === 'admin' ? 'ADMIN' : item.t.toUpperCase()}</span>` : '';

      row.innerHTML = `<div class="keys">${keysHtml}</div><span class="desc">${item.d}</span>${tagHtml}`;
      grid.appendChild(row);
    });

    secEl.appendChild(grid);
    content.appendChild(secEl);
  });

  // ── Category nav click ──
  const catBtns = catNav.querySelectorAll('.cat-btn');
  const sections = content.querySelectorAll('.section');

  catBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      catBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sections.forEach(sec => {
        sec.classList.toggle('hidden', cat !== 'all' && sec.dataset.cat !== cat);
      });
      document.getElementById('search').value = '';
      content.querySelectorAll('.shortcut-row').forEach(r => r.classList.remove('hidden'));
      content.querySelectorAll('.sub-header').forEach(r => r.classList.remove('hidden'));
      document.getElementById('search-stats').classList.remove('active');
    });
  });

  // ── Search ──
  const searchInput = document.getElementById('search');
  const searchStats = document.getElementById('search-stats');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    const allRows = content.querySelectorAll('.shortcut-row');
    const allSubs = content.querySelectorAll('.sub-header');

    if (!q) {
      allRows.forEach(r => r.classList.remove('hidden'));
      allSubs.forEach(r => r.classList.remove('hidden'));
      sections.forEach(s => s.classList.remove('hidden'));
      searchStats.classList.remove('active');
      const activeCat = catNav.querySelector('.cat-btn.active').dataset.cat;
      if (activeCat !== 'all') {
        sections.forEach(s => { if (s.dataset.cat !== activeCat) s.classList.add('hidden'); });
      }
      return;
    }

    // Show all sections during search
    catBtns.forEach(b => b.classList.remove('active'));
    catNav.querySelector('[data-cat="all"]').classList.add('active');
    sections.forEach(s => s.classList.remove('hidden'));
    allSubs.forEach(s => s.classList.remove('hidden'));

    const terms = q.split(/\s+/);
    let visible = 0;

    allRows.forEach(row => {
      const text = row.dataset.keywords;
      const match = terms.every(t => text.includes(t));
      row.classList.toggle('hidden', !match);
      if (match) visible++;
    });

    // Hide empty sections
    sections.forEach(sec => {
      const hasVisible = sec.querySelectorAll('.shortcut-row:not(.hidden)').length > 0;
      sec.classList.toggle('hidden', !hasVisible);
    });

    searchStats.textContent = visible + ' of ' + totalCount + ' shortcuts';
    searchStats.classList.add('active');
  });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput && !cmdpOpen()) {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.blur();
      searchInput.value = '';
      searchInput.dispatchEvent(new Event('input'));
    }
  });

  // ── Command Palette ──
  const cmdpEl = document.createElement('div');
  cmdpEl.className = 'cmdp-overlay';
  cmdpEl.innerHTML =
    '<div class="cmdp">' +
    '<div class="cmdp-input-row">' +
    '<span class="cmdp-prompt">&#62;</span>' +
    '<input type="text" class="cmdp-input" id="cmdp-input" placeholder="Type to search shortcuts\u2026" autocomplete="off" spellcheck="false">' +
    '<span class="cmdp-hint">ESC</span>' +
    '</div>' +
    '<div class="cmdp-results" id="cmdp-results"></div>' +
    '<div class="cmdp-foot">' +
    '<span><kbd>&#8593;&#8595;</kbd> navigate</span><span><kbd>&#8629;</kbd> jump</span>' +
    '<span class="cmdp-foot-spacer"></span>' +
    '<span class="cmdp-count" id="cmdp-count"></span>' +
    '</div></div>';
  document.body.appendChild(cmdpEl);

  const cmdpOverlay = cmdpEl;
  const cmdpInput = document.getElementById('cmdp-input');
  const cmdpResults = document.getElementById('cmdp-results');
  const cmdpCount = document.getElementById('cmdp-count');
  const cmdpOpen = () => cmdpOverlay.classList.contains('show');
  let cmdpIdx = 0, cmdpRows = [];

  const palIndex = [];
  DATA.forEach(cat => {
    cat.items.filter(it => it.k).forEach(it => {
      palIndex.push({
        desc: it.d, keys: it.k.join('+'), cat: cat.label,
        hay: (it.d + ' ' + cat.label + ' ' + it.k.join(' ')).toLowerCase()
      });
    });
  });

  function palFuzzy(q, text) {
    const ql = q.toLowerCase(), tl = text.toLowerCase();
    if (tl.includes(ql)) return 100;
    let qi = 0, score = 0, consec = 0;
    for (let i = 0; i < tl.length && qi < ql.length; i++) {
      if (tl[i] === ql[qi]) { score += 1 + consec * 5; consec++; qi++; }
      else consec = 0;
    }
    return qi < ql.length ? 0 : score + 50;
  }

  function cmdpRender() {
    const q = cmdpInput.value.trim();
    cmdpResults.innerHTML = '';
    if (!q) {
      cmdpResults.innerHTML = '<div class="cmdp-empty">Type to search ' + palIndex.length + ' shortcuts</div>';
      cmdpCount.textContent = ''; cmdpRows = []; return;
    }
    const scored = palIndex
      .map(it => ({ it, score: palFuzzy(q, it.hay) }))
      .filter(s => s.score >= 20)
      .sort((a, b) => b.score - a.score)
      .slice(0, 15);
    cmdpRows = scored.map(s => s.it);
    cmdpCount.textContent = scored.length;
    if (!scored.length) { cmdpResults.innerHTML = '<div class="cmdp-empty">No matches</div>'; return; }
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    scored.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'cmdp-row' + (i === 0 ? ' active' : '');
      row.innerHTML =
        '<span class="cmdp-row-desc">' + esc(s.it.desc) + '</span>' +
        '<span class="cmdp-row-cat">' + esc(s.it.cat) + '</span>';
      row.addEventListener('click', () => cmdpActivate(i));
      row.addEventListener('mouseenter', () => { cmdpIdx = i; cmdpHighlight(); });
      cmdpResults.appendChild(row);
    });
    cmdpIdx = 0;
  }
  function cmdpHighlight() {
    Array.from(cmdpResults.children).forEach((c, i) => c.classList.toggle('active', i === cmdpIdx));
    if (cmdpResults.children[cmdpIdx]) cmdpResults.children[cmdpIdx].scrollIntoView({ block: 'nearest' });
  }
  function cmdpActivate(i) {
    const it = cmdpRows[i];
    if (!it) return;
    cmdpClose();
    const allRows = content.querySelectorAll('.shortcut-row');
    for (const row of allRows) {
      if ((row.dataset.keywords || '').includes(it.desc.slice(0, 25).toLowerCase())) {
        const sec = row.closest('.section');
        if (sec) sec.classList.remove('hidden');
        row.classList.remove('hidden');
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.classList.add('cmdp-flash-row');
        setTimeout(() => row.classList.remove('cmdp-flash-row'), 600);
        break;
      }
    }
  }
  function cmdpShow() { cmdpOverlay.classList.add('show'); cmdpInput.value = ''; cmdpRender(); setTimeout(() => cmdpInput.focus(), 0); }
  function cmdpClose() { cmdpOverlay.classList.remove('show'); }
  cmdpInput.addEventListener('input', cmdpRender);
  cmdpInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (cmdpIdx < cmdpRows.length - 1) { cmdpIdx++; cmdpHighlight(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (cmdpIdx > 0) { cmdpIdx--; cmdpHighlight(); } }
    else if (e.key === 'Enter') { e.preventDefault(); cmdpActivate(cmdpIdx); }
    else if (e.key === 'Escape') { e.preventDefault(); cmdpClose(); }
  });
  cmdpOverlay.addEventListener('click', e => { if (e.target === cmdpOverlay) cmdpClose(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      if (cmdpOpen()) cmdpClose(); else cmdpShow();
    }
  });
})();
